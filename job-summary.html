<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Summary — Tech Service</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F2A24">
<style>
  :root {
    --bg: #F6F3EC; --ink: #1F2A24; --accent: #4B6A4E; --accent-2: #8A6A3C;
    --line: #D8D2C2; --done: #9A9A8E; --card: #FFFFFF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141815; --ink: #EDEAE2; --accent: #7FA383;
      --accent-2: #C9A26B; --line: #2B322C; --done: #5C6259; --card: #1B211C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141815; --ink: #EDEAE2; --accent: #7FA383;
    --accent-2: #C9A26B; --line: #2B322C; --done: #5C6259; --card: #1B211C;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  header { padding: 20px 16px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  h1 { margin: 0; font-size: 20px; font-weight: 700; }
  main { padding: 14px 16px 40px; max-width: 520px; margin: 0 auto; }
  h2 { font-size: 16px; margin: 18px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--done); margin-bottom: 4px; }
  input[type=text] { width: 100%; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: inherit; }
  .field { margin-bottom: 10px; }
  .btn { font-family: inherit; font-size: 15px; font-weight: 600; padding: 11px 16px; border-radius: 10px; border: none; background: var(--accent); color: var(--bg); cursor: pointer; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn.small { padding: 7px 12px; font-size: 13px; }
  .btn.block { width: 100%; }
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; cursor: pointer; background: var(--bg); }
  .chip.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  textarea { width: 100%; min-height: 90px; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-family: inherit; }
  pre#summaryText { white-space: pre-wrap; font-family: "SF Mono", Menlo, monospace; font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
</style>
</head>
<body>

<header><h1>📝 Job Summary</h1></header>
<main id="app"></main>

<script>
const STORAGE_KEY = "job_summary_estado_v1";

const PAYMENT_OPTS = ["Visa", "Mastercard", "Debit", "Cash", "Pending – please contact the customer", "Commercial"];
const SURFACE_OPTS = ["Carpet", "Upholstery", "Hard Surface Floors"];
const CARPET_FIBER_OPTS = ["Wool", "Synthetic"];
const HARD_SURFACE_OPTS = ["Tile / Grout", "Laminated"];
const LEVEL_OPTS = ["Easy", "Medium", "Difficult"];
const EQUIPMENT_OPTS = ["Portable", "Truck mount", "Cimex"];
const PRODUCTS_OPTS = [
  "Procyon","Citrus","Releasit","Flex","Bio Break","Boost All","Pure O2","Eco Cide",
  "Petzap IQ","Wool Medic","Groutmaster","Triplephase","Volume 40","Spot Stop",
  "Green Guard (protector)","Rob Solvent (protector)","Avenge Pro","Folex",
  "Dry Solvent","T-rust","Defoamer"
];

function nuevoEstado() {
  return {
    checkIn: "", checkOut: "",
    payment: [], surfaces: [], carpetFiber: "", hardSurface: [],
    parking: "", setup: "",
    equipment: [], products: [],
    description: "",
    summary: "",
  };
}
let state = cargar();
function cargar() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return nuevoEstado();
}
function guardar() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

function toggleIn(arr, val) {
  const i = arr.indexOf(val);
  if (i >= 0) arr.splice(i, 1); else arr.push(val);
}
function formatListWithAnd(items) {
  if (!items.length) return "";
  if (items.length === 1) return items[0];
  if (items.length === 2) return `${items[0]} and ${items[1]}`;
  return `${items.slice(0, -1).join(", ")} and ${items[items.length - 1]}`;
}
const SECTION_DIVIDER = "-----------------------------\n";

function chipGroup(groupKey, options, selected, multi) {
  return `<div class="chip-wrap">${options.map(opt => `
    <span class="chip ${selected.includes ? (selected.includes(opt) ? "on" : "") : (selected === opt ? "on" : "")}"
          data-group="${groupKey}" data-opt="${opt.replace(/"/g,'&quot;')}" data-multi="${multi ? "1" : "0"}">${opt}</span>
  `).join("")}</div>`;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <a href="index.html" class="btn ghost small" style="display:inline-block;margin-bottom:10px;text-decoration:none">🏠 Menú principal</a>

    <h2>Job Time</h2>
    <div class="card">
      <div class="field"><label>Check-in time</label><input type="text" id="checkIn" value="${state.checkIn}"></div>
      <div class="field"><label>Check-out time</label><input type="text" id="checkOut" value="${state.checkOut}"></div>
    </div>

    <h2>Payment Information</h2>
    <div class="card">${chipGroup("payment", PAYMENT_OPTS, state.payment, true)}</div>

    <h2>Surfaces Cleaned</h2>
    <div class="card">${chipGroup("surfaces", SURFACE_OPTS, state.surfaces, true)}</div>

    ${state.surfaces.includes("Carpet") ? `
      <h2>Carpet Fiber</h2>
      <div class="card">${chipGroup("carpetFiber", CARPET_FIBER_OPTS, state.carpetFiber, false)}</div>
    ` : ""}

    ${state.surfaces.includes("Hard Surface Floors") ? `
      <h2>Surface</h2>
      <div class="card">${chipGroup("hardSurface", HARD_SURFACE_OPTS, state.hardSurface, true)}</div>
    ` : ""}

    <h2>Site Logistics</h2>
    <div class="card">
      <label>Parking</label>
      ${chipGroup("parking", LEVEL_OPTS, state.parking, false)}
      <div style="height:10px"></div>
      <label>Setup</label>
      ${chipGroup("setup", LEVEL_OPTS, state.setup, false)}
    </div>

    <h2>Technical Work</h2>
    <div class="card">
      <label>Equipment Used</label>
      ${chipGroup("equipment", EQUIPMENT_OPTS, state.equipment, true)}
    </div>
    <div class="card">
      <label>Products Applied</label>
      ${chipGroup("products", PRODUCTS_OPTS, state.products, true)}
    </div>

    <h2>Job Description</h2>
    <div class="card"><textarea id="description" placeholder="Describe the work performed">${state.description.replace(/</g,'&lt;')}</textarea></div>

    <button class="btn block" id="genSummary">Generate Summary</button>

    ${state.summary ? `
      <h2>Final Job Summary</h2>
      <pre id="summaryText">${state.summary.replace(/</g,'&lt;')}</pre>
      <button class="btn block" id="copySummary">📋 Copy Summary</button>
    ` : ""}
  `;
  bind();
}

function bind() {
  document.getElementById("checkIn").addEventListener("input", e => { state.checkIn = e.target.value; guardar(); });
  document.getElementById("checkOut").addEventListener("input", e => { state.checkOut = e.target.value; guardar(); });
  document.getElementById("description").addEventListener("input", e => { state.description = e.target.value; guardar(); });

  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const group = chip.dataset.group;
      const opt = chip.dataset.opt;
      const multi = chip.dataset.multi === "1";
      if (multi) {
        toggleIn(state[group], opt);
      } else {
        state[group] = (state[group] === opt) ? "" : opt;
      }
      guardar(); render();
    });
  });

  document.getElementById("genSummary").addEventListener("click", () => {
    let s = "";
    s += "JOB TIME\n";
    if (state.checkIn) s += `Check-in: ${state.checkIn}\n`;
    if (state.checkOut) s += `Check-out: ${state.checkOut}\n`;
    s += SECTION_DIVIDER;

    if (state.payment.length) {
      s += "PAYMENT INFORMATION\n";
      s += `${formatListWithAnd(state.payment)}.\n`;
      s += SECTION_DIVIDER;
    }

    if (state.parking || state.setup) {
      s += "SITE LOGISTICS\n";
      if (state.parking) s += `Parking: ${state.parking}.\n`;
      if (state.setup) s += `Setup: ${state.setup}.\n`;
      s += SECTION_DIVIDER;
    }

    if (state.equipment.length) {
      s += "EQUIPMENT USED\n";
      s += `${formatListWithAnd(state.equipment)}.\n`;
      s += SECTION_DIVIDER;
    }

    if (state.carpetFiber || state.hardSurface.length) {
      s += "TECHNICAL DETAILS\n";
      if (state.carpetFiber) s += `Carpet: ${state.carpetFiber}\n`;
      if (state.hardSurface.length) s += `Surface: ${formatListWithAnd(state.hardSurface)}\n`;
      s += SECTION_DIVIDER;
    }

    if (state.products.length) {
      s += "PRODUCTS APPLIED\n";
      s += `${formatListWithAnd(state.products)}.\n`;
      s += SECTION_DIVIDER;
    }

    if (state.description.trim()) {
      let d = state.description.trim();
      d = d[0].toUpperCase() + d.slice(1);
      if (!d.endsWith(".")) d += ".";
      s += "JOB DESCRIPTION\n";
      s += `${d}\n`;
      s += SECTION_DIVIDER;
    }

    state.summary = s;
    guardar(); render();
  });

  const copyBtn = document.getElementById("copySummary");
  if (copyBtn) copyBtn.addEventListener("click", (e) => {
    navigator.clipboard.writeText(state.summary).then(() => {
      e.target.innerText = "✅ Copied!";
      setTimeout(() => { e.target.innerText = "📋 Copy Summary"; }, 1800);
    }).catch(() => {
      e.target.innerText = "⚠️ Could not copy — select text manually";
      setTimeout(() => { e.target.innerText = "📋 Copy Summary"; }, 2500);
    });
  });
}

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
