<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tech Service Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F2A24">
<style>
  :root {
    --bg: #F6F3EC; --ink: #1F2A24; --accent: #4B6A4E; --accent-2: #8A6A3C;
    --line: #D8D2C2; --done: #9A9A8E; --card: #FFFFFF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141815; --ink: #EDEAE2; --accent: #7FA383;
      --accent-2: #C9A26B; --line: #2B322C; --done: #5C6259; --card: #1B211C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141815; --ink: #EDEAE2; --accent: #7FA383;
    --accent-2: #C9A26B; --line: #2B322C; --done: #5C6259; --card: #1B211C;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  h1 { font-size: 26px; margin: 0 0 4px; text-align: center; }
  p.sub { color: var(--done); margin: 0 0 32px; text-align: center; }
  .cards { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
  a.card {
    display: block; text-decoration: none; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px 20px; text-align: center;
  }
  a.card .icon { font-size: 36px; margin-bottom: 8px; }
  a.card .title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  a.card .desc { font-size: 13px; color: var(--done); }
  a.card:active { opacity: .85; }
</style>
</head>
<body>
  <h1>🛠️ Tech Service Hub</h1>
  <p class="sub">Tu centro de operaciones integral</p>
  <div class="cards">
    <a class="card" href="commercial.html">
      <div class="icon">🏢</div>
      <div class="title">Commercial</div>
      <div class="desc">Edificios, hallways y escaleras</div>
    </a>
    <a class="card" href="residential.html">
      <div class="icon">🏠</div>
      <div class="title">Residential</div>
      <div class="desc">Habitaciones, pisos y escaleras</div>
    </a>
    <a class="card" href="job-summary.html">
      <div class="icon">📝</div>
      <div class="title">Job Summary</div>
      <div class="desc">Resúmenes del día de trabajo</div>
    </a>
  </div>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
